<title>Aromakarte</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Outfit:wght@400;500;600&display=swap">
<style>
/* Layout: start screen with two large choices; each choice opens a filter panel (left / top on phones) + card grid. Built for an iPad at the counter */
:root{--bg:#f4f3f7;--surface:#ffffff;--ink:#18161f;--muted:#5e5a6a;--line:#e3e1e9;--chip:#ecebf1;--accent:#5a45c4;--cool-bg:#e3f1fb;--cool:#1d6aa8;--sh:#c2410c;--ec:#2d6db3;--lq:#14795a;
--display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;--body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131218;--surface:#1d1b24;--ink:#eeedf3;--muted:#a6a2b4;--line:#2e2b38;--chip:#272431;--accent:#a596ff;--cool-bg:#16314a;--cool:#8cc6f4;--sh:#fb923c;--ec:#7fb3ee;--lq:#5fd0a4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131218;--surface:#1d1b24;--ink:#eeedf3;--muted:#a6a2b4;--line:#2e2b38;--chip:#272431;--accent:#a596ff;--cool-bg:#16314a;--cool:#8cc6f4;--sh:#fb923c;--ec:#7fb3ee;--lq:#5fd0a4;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit}
/* start */
.start{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-block:40px;padding-inline:max(16px,4vw);gap:28px;max-width:1200px;margin:0 auto}
.start .eyebrow{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.start h1{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,7vw,4.6rem);line-height:.92;letter-spacing:-.03em;margin:8px 0 0;text-wrap:balance}
.start p.q{font-size:1.25rem;color:var(--muted);margin:14px 0 0}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));grid-template-columns:1fr;gap:18px}
.choice{position:relative;text-align:left;border:0;cursor:pointer;border-radius:24px;padding:26px 26px 24px;min-height:300px;background:var(--surface);box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;touch-action:manipulation;transition:transform .15s}
.choice:active{transform:scale(.985)}
.choice .art{position:absolute;inset:0 0 auto 0;height:62%;display:flex;align-items:center;justify-content:center;gap:0}
.choice.sh .art{background:radial-gradient(120% 100% at 70% 0%,color-mix(in srgb,var(--sh) 22%,transparent),transparent 70%)}
.choice.ec .art{background:radial-gradient(120% 100% at 70% 0%,color-mix(in srgb,var(--ec) 22%,transparent),transparent 70%)}.choice.lq .art{background:radial-gradient(120% 100% at 70% 0%,color-mix(in srgb,var(--lq) 22%,transparent),transparent 70%)}
.choice .lqart img.pd{height:80%;margin:0 -6px;position:relative;z-index:1}.choice h2{text-wrap:balance}
.choice .art img.fr{width:96px;height:96px;border-radius:50%;box-shadow:0 0 0 4px var(--surface),0 6px 14px rgba(0,0,0,.2);margin-left:-18px}
.choice .art img.fr:first-child{margin-left:0}
.choice .meta{padding-right:64px}
.choice .ecart{align-items:flex-end;padding-bottom:4%;box-sizing:border-box}.choice .ecart img.pd{max-width:24%;object-fit:contain}
.choice .art img.pd{height:84%;filter:drop-shadow(0 8px 12px rgba(0,0,0,.22));margin-left:-10px}
.choice h2{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1;margin:0;letter-spacing:-.02em}
.choice.sh h2{color:var(--sh)}.choice.ec h2{color:var(--ec)}.choice.lq h2{color:var(--lq)}
.choice .meta{color:var(--muted);margin-top:6px;font-size:1rem}
.choice .go{position:absolute;right:22px;bottom:24px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:1.5rem}
.choice.sh .go{background:var(--sh)}.choice.ec .go{background:var(--ec)}.choice.lq .go{background:var(--lq)}
.start .age{font-size:.88rem;color:var(--muted)}
/* catalog */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 18px 40px;display:flex;flex-direction:column;gap:20px}
.back{align-self:flex-start;border:1px solid var(--line);background:var(--chip);border-radius:999px;min-height:44px;padding:8px 14px;cursor:pointer;font-weight:600}
.switch{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.switch button{font-size:.84rem;line-height:1.1;padding:4px 2px;border:0;background:transparent;border-radius:9px;min-height:42px;cursor:pointer;font-weight:600;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
aside h1{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:.95;letter-spacing:-.02em;margin:0}
.lead{margin:6px 0 0;color:var(--muted);font-size:.9rem}
.grp h2{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.grp h2 button{letter-spacing:.06em;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-transform:none;font-size:.78rem}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:.92rem;min-height:44px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--chip);cursor:pointer;display:inline-flex;align-items:center;gap:7px;touch-action:manipulation}
.chip small{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--bc)}
.chip.cool[aria-pressed="true"]{background:var(--cool);border-color:var(--cool);color:#fff}
.chip:disabled{opacity:.45;cursor:default}
#filters{display:flex;flex-direction:column;gap:20px}
main{min-width:0;padding:0 22px 60px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:18px 0 12px;border-bottom:1px solid var(--line)}
.bar input{flex:1 1 240px;min-width:0;font:inherit;min-height:48px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.bar select{font:inherit;min-height:48px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.reset{min-height:48px;padding:8px 16px;border-radius:12px;border:1px solid var(--accent);color:var(--accent);background:transparent;font-weight:600;cursor:pointer}
.count{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.active{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.active span{font-size:.8rem;background:var(--chip);border-radius:999px;padding:3px 10px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:96px 1fr;overflow:hidden;min-width:0}
.sw{position:relative;background:linear-gradient(135deg,var(--c1),var(--c2));min-height:96px}
.code{position:absolute;z-index:2;left:6px;top:6px;min-width:34px;height:34px;padding:0 6px;border-radius:999px;display:grid;place-items:center;background:var(--bc);color:#fff;font:800 .82rem/1 var(--display);letter-spacing:.02em;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.3)}
.frw{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);aspect-ratio:1/1}
.f{position:absolute;border-radius:50%;box-shadow:0 0 0 2px #fff,0 2px 5px rgba(0,0,0,.25)}
.n1 .f1{width:72%;left:14%;top:14%}
.n2 .f1{width:56%;left:9%;top:9%}.n2 .f2{width:56%;left:35%;top:35%}
.n3 .f1{width:46%;left:6%;top:8%}.n3 .f2{width:46%;left:48%;top:8%}.n3 .f3{width:46%;left:27%;top:47%}
.tx{padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.br{font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--bc);padding:2px 7px;border-radius:5px}
.ln{font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:1px 6px;border-radius:5px}
.pr{margin-left:auto;font-size:.85rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tx h3 .cd{font-weight:800}.tx h3{font-family:var(--display);font-weight:800;font-size:1.1rem;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.tx p{margin:0;font-size:.88rem;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--cool-bg);color:var(--cool)}
.tag.mg{background:var(--chip);color:var(--ink)}
.tag svg,.chip svg{width:12px;height:12px}
.empty{padding:60px 0;color:var(--muted);font-size:1.05rem}
footer{margin-top:28px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
footer b{color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:0 16px 60px}}
@media (prefers-reduced-motion:reduce){.choice{transition:none}.choice:active{transform:none}}
.choice .lqart img.fr{width:80px;height:80px}
@media (min-width:1000px){.choices{grid-template-columns:repeat(3,minmax(0,1fr))}.choice .art img.fr{width:82px;height:82px}.choice .lqart img.fr{width:62px;height:62px}}
@media (min-width:600px) and (max-width:999px){.choice{min-height:260px}}
</style>

  const ck=c=>rows.filter(r=>match(r,'k')&&r.k.includes(c)).length;
  const cats=D.cats.filter(c=>rows.some(r=>r.k.includes(c)));
  const cb=b=>rows.filter(r=>match(r,'b')&&r.b===b).length;
  const cc=rows.filter(r=>match(r,'c')&&r.c).length;
  const cz=rows.filter(r=>match(r,'z')&&(r.mg||[]).includes('0 mg')).length;
  return `<div class="grp"><h2>Geschmack <button type="button" data-clear="k">Alle</button></h2><div class="chips">${cats.map(c=>`<button type="button" class="chip" data-k="${esc(c)}" aria-pressed="${st.k.has(c)}">${esc(c)} <small>${ck(c)}</small></button>`).join('')}</div></div>
  <div class="grp"><h2>Kühleffekt</h2><div class="chips"><button type="button" class="chip cool" data-t="cool" aria-pressed="${st.cool}">${SNOW} Nur kühle Sorten <small>${cc}</small></button></div></div>
  ${st.mode!=='shisha'?`<div class="grp"><h2>Nikotin</h2><div class="chips"><button type="button" class="chip" data-t="zero" aria-pressed="${st.zero}">Auch nikotinfrei (0 mg) <small>${cz}</small></button></div></div>`:''}
  <div class="grp"><h2>${m.group} <button type="button" data-clear="b">Alle</button></h2><div class="chips">${groups.map(b=>`<button type="button" class="chip" data-b="${esc(b)}" aria-pressed="${st.b.has(b)}" style="--bc:${m.colors[b]}"><span class="dot"></span>${esc(b)} <small>${cb(b)}</small></button>`).join('')}</div></div>`;
}
function card(r){
  const m=M();
  let c1,c2;
  if(r.c1){c1=r.c1;c2=r.c2}else{const a=D.col[r.f[0]]||[200,200,200],b=D.col[r.f[r.f.length-1]]||a;c1=tint(a,.45);c2=tint(b,.2)}
  const tags=(r.mg||[]).filter(()=>st.mode==='ecig'&&r.b==='Tappo Air').map(x=>`<span class="tag mg">${x}</span>`).join('')+(r.c?`<span class="tag">${SNOW}kühl</span>`:'');
  return `<article class="card"><div class="sw" style="--c1:${c1};--c2:${c2}">${r.code?`<span class="code" style="--bc:${m.colors[r.b]}">${esc(r.code)}</span>`:''}<div class="frw n${r.f.length}">${r.f.map((f,i)=>`<img class="f f${i+1}" src="${D.imgs[f]}" alt="">`).join('')}</div></div>
  <div class="tx"><div class="top"><span class="br" style="--bc:${m.colors[r.b]}">${esc(r.b)}</span>${r.l?`<span class="ln">${esc(r.l)}</span>`:''}${r.p?`<span class="pr">${eur(r.p)}</span>`:''}</div>
  <h3>${r.code?`<span class="cd" style="color:${m.colors[r.b]}">${esc(r.code)}</span> `:''}${esc(r.n)}</h3><p>${esc(r.d)}</p>${tags?`<div class="tags">${tags}</div>`:''}</div></article>`}
function catView(){
  const m=M();
  root.innerHTML=`<div class="app"><aside aria-label="Filter">
   <button type="button" class="back" data-t="home">← Auswahl</button>
   <div class="switch" role="group" aria-label="Bereich"><button type="button" data-mode="shisha" aria-pressed="${st.mode==='shisha'}">Shisha-Tabak</button><button type="button" data-mode="ecig" aria-pressed="${st.mode==='ecig'}">E-Zigaretten</button><button type="button" data-mode="liq" aria-pressed="${st.mode==='liq'}">Liquids & Aromen</button></div>
   <div><h1>${m.title}</h1><p class="lead">${m.lead}</p></div>
   <div id="filters"></div></aside>
   <main><div class="bar" role="search"><input id="q" type="search" placeholder="${m.search}" aria-label="Suchen" autocomplete="off" value="${esc(st.q)}">
   <select id="sort" aria-label="Sortierung"><option value="b">Nach ${m.group}</option><option value="n">Name A–Z</option>${st.mode==='shisha'?'<option value="pa">Preis aufsteigend</option><option value="pd">Preis absteigend</option>':''}</select>
   <button type="button" class="reset" data-t="reset" hidden>Alle anzeigen</button><span class="count" id="count"></span></div>
   <div class="active" id="active"></div><div class="grid" id="grid"></div><footer>${m.warn} Bei mehreren Geschmäckern werden Sorten angezeigt, die mindestens einen davon enthalten.</footer></main></div>`;
  document.getElementById('q').addEventListener('input',e=>{st.q=e.target.value;update()});
  document.getElementById('sort').addEventListener('change',e=>{st.sort=e.target.value;update()});
  update();
}
function update(){
  const m=M(),groups=Object.keys(m.colors);
  document.getElementById('filters').innerHTML=chipsHTML();
  const a=m.rows.filter(r=>match(r));
  const by={b:(x,y)=>groups.indexOf(x.b)-groups.indexOf(y.b)||x.n.localeCompare(y.n,'de'),n:(x,y)=>x.n.localeCompare(y.n,'de'),pa:(x,y)=>x.p-y.p||x.n.localeCompare(y.n,'de'),pd:(x,y)=>y.p-x.p||x.n.localeCompare(y.n,'de')};
  a.sort(by[st.sort]||by.b);
  document.getElementById('grid').innerHTML=a.length?a.map(card).join(''):'<p class="empty">Keine Sorte passt zu dieser Auswahl. Tippen Sie auf „Alle anzeigen“.</p>';
  document.getElementById('count').textContent=a.length+' von '+m.rows.length+(st.mode!=='shisha'?' Aromen':' Sorten');
  const any=st.k.size||st.b.size||st.cool||st.zero||st.q;
  root.querySelector('[data-t="reset"]').hidden=!any;
  document.getElementById('active').innerHTML=[...st.k,...st.b].map(x=>`<span>${esc(x)}</span>`).join('')+(st.cool?'<span>kühl</span>':'')+(st.zero?'<span>0 mg</span>':'');
  document.getElementById('sort').value=st.sort;
}
function clearF(){st.k.clear();st.b.clear();st.cool=false;st.zero=false;st.q='';st.sort='b'}
function go(mode){clearF();st.mode=mode;try{history.replaceState(null,'',mode?('#'+MH[mode]):location.pathname+location.search)}catch(e){}render();window.scrollTo(0,0)}
function render(){st.mode?catView():startView()}
root.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.mode){if(t.dataset.mode!==st.mode)go(t.dataset.mode);return}
  if(t.dataset.t==='home'){go(null);return}
  if(t.dataset.k){st.k.has(t.dataset.k)?st.k.delete(t.dataset.k):st.k.add(t.dataset.k)}
  else if(t.dataset.b){st.b.has(t.dataset.b)?st.b.delete(t.dataset.b):st.b.add(t.dataset.b)}
  else if(t.dataset.t==='cool'){st.cool=!st.cool}
  else if(t.dataset.t==='zero'){st.zero=!st.zero}
  else if(t.dataset.clear){st[t.dataset.clear].clear()}
  else if(t.dataset.t==='reset'){clearF();const q=document.getElementById('q');if(q)q.value=''}
  else return;
  update()});
let idle;['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev,()=>{clearTimeout(idle);idle=setTimeout(()=>{if(st.mode)go(null)},180000)},{passive:true}));
render();
</script>

<script>if("serviceWorker"in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{}))}</script>
</body></html>
