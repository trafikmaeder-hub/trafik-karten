<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trafik-Karten</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f3f0,#151514);--ink:light-dark(#1b1b1a,#efede8);--mu:light-dark(#5f5d58,#a9a69f);--card:light-dark(#fff,#201f1d);--line:light-dark(#e1ded8,#33312e)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,system-ui,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
main{width:100%;max-width:760px}h1{font-size:34px;line-height:1.1;margin:0 0 6px}p{color:var(--mu);margin:0 0 24px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
a{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;color:inherit;text-decoration:none;min-height:44px}
a img{width:76px;height:76px;border-radius:18px;flex:none}a b{display:block;font-size:20px}a span{color:var(--mu);font-size:15px}
.tip{margin-top:28px;font-size:15px;color:var(--mu)}
</style></head><body><main>
<h1>Trafik-Karten</h1>
<p>Zwei Karten für das iPad an der Theke.</p>
<div class="g">
<a href="aromakarte/"><img src="aromakarte/icon-192.png" alt=""><div><b>Aromakarte</b><span>Shisha-Tabak, E-Zigaretten, Liquids &amp; Aromen</span></div></a>
<a href="humidor/#theke"><img src="humidor/icon-192.png" alt=""><div><b>Humidor-Katalog</b><span>Zigarren mit Stärke, Aroma und Preis</span></div></a>
</div>
<p class="tip">Als App installieren: Karte in Safari öffnen, auf Teilen tippen und „Zum Home-Bildschirm“ wählen.</p>
</main></body></html>
