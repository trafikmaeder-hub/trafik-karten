/* Layout: humidor shelf — brand sections as shelves, cigars as cards on a cedar-toned ground; filter bar sticky on top */
:root{
  --bg:#e9ece6; --surface:#f7f8f4; --ink:#1f2a24; --muted:#5d6a61; --line:#cdd3ca;
  --accent:#7a4a22; --band:#b08a3e; --band-ink:#2a1d0c; --chip:#dfe4dc;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;

  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161b18; --surface:#1f2622; --ink:#e7ebe4; --muted:#9aa69d; --line:#323b35;
  --accent:#d39a62; --band:#c9a457; --band-ink:#1c1408; --chip:#2a332e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161b18; --surface:#1f2622; --ink:#e7ebe4; --muted:#9aa69d; --line:#323b35;
  --accent:#d39a62; --band:#c9a457; --band-ink:#1c1408; --chip:#2a332e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:1px solid var(--line);padding-bottom:18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,5vw,3.2rem);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.meta{color:var(--muted);font-size:.86rem;display:flex;flex-direction:column;gap:2px;text-align:right}
.meta b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input,.bar select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.bar input{flex:1 1 220px}
.bar select{flex:0 1 auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:.85rem;background:var(--surface);color:var(--ink);border:0;padding:8px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.count{color:var(--muted);font-size:.85rem;margin-left:auto;font-variant-numeric:tabular-nums}
.editbtn{font:inherit;font-size:.85rem;border:1px dashed var(--accent);color:var(--accent);background:transparent;border-radius:6px;padding:7px 11px;cursor:pointer}
.editbtn[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-style:solid}
.index{display:flex;flex-wrap:wrap;gap:4px 14px;padding-block:14px;font-size:.85rem}
.index a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent}
.index a:hover,.index a:focus-visible{color:var(--ink);border-color:var(--accent)}
.hint{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--band);padding:10px 14px;font-size:.88rem;color:var(--muted);border-radius:4px}
.hint b{color:var(--ink)}
section.brand{padding-top:30px;scroll-margin-top:80px}
.brand h2{font-family:var(--display);font-weight:500;font-size:1.65rem;margin:0 0 14px;display:flex;align-items:baseline;gap:12px}
.brand h2 small{font-family:var(--body);font-size:.8rem;color:var(--muted);font-weight:400;letter-spacing:.06em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.pic{aspect-ratio:16/10;max-width:100%;background:var(--chip);display:grid;place-items:center;position:relative;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:contain;background:#fff}
.pic svg{width:92%;height:auto}
.pic.sel{outline:3px solid var(--band);outline-offset:-3px}
.pic.drag{outline:3px dashed var(--accent);outline-offset:-3px}
.pic .busy{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 80%,transparent);font-size:.85rem}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.name{font-family:var(--display);font-size:1.12rem;line-height:1.25;font-weight:500;margin:0;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;background:var(--chip);color:var(--ink);padding:2px 7px;border-radius:3px}
.chip.ltd{background:var(--band);color:var(--band-ink)}
.foot{margin-top:auto;display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-top:6px;border-top:1px solid var(--line)}
.price{font-family:var(--mono);font-size:1.15rem;font-weight:500;font-variant-numeric:tabular-nums}
.price small{font-family:var(--body);font-size:.75rem;color:var(--muted);font-weight:400}
.nr{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tools button,.tools a,.tools label{font:inherit;font-size:.8rem;color:var(--accent);background:transparent;border:1px solid var(--line);border-radius:5px;padding:4px 8px;cursor:pointer;text-decoration:none}
.tools input{position:absolute;width:1px;height:1px;opacity:0}
.tools label:focus-within{outline:2px solid var(--accent)}
.str{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
.str .dots{display:inline-flex;gap:3px}
.str .dots i{width:14px;height:6px;border-radius:1px;background:var(--line)}
.str .dots i.on{background:var(--accent)}
.str b{color:var(--ink);font-weight:500}
.aroma{font-size:.85rem;color:var(--muted);margin:0}
details.more{border-top:1px solid var(--line);padding-top:6px}
details.more summary{cursor:pointer;font-size:.85rem;color:var(--accent);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ ";font-family:var(--mono)}
details.more[open] summary::before{content:"– "}
.story{font-size:.9rem;margin:8px 0}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.82rem;margin:6px 0 0}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted);padding-top:10px}
.arw{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:.8rem;margin:8px 0 2px}
.arw span{color:var(--muted)}
.arw .bar5{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.arw .bar5 i{display:block;height:100%;background:var(--accent)}
.arw b{font-family:var(--mono);font-weight:400;font-size:.75rem;color:var(--muted)}
.notes{display:flex;flex-wrap:wrap;gap:4px}
.notes span{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--ink)}
.notes span em{font-style:normal;color:var(--accent);margin-left:3px;letter-spacing:-1px}
.empty{padding:40px 0;color:var(--muted)}
/* Thekenansicht (iPad quer) */
body.kiosk{font-size:17px}
.k-app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.k-side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding-block:22px 40px;padding-inline:20px;display:flex;flex-direction:column;gap:22px}
.k-brand{font-family:var(--display);font-size:2rem;line-height:1;margin:0}
.k-brand em{color:var(--accent);font-weight:500}
.k-side h3{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
.k-opts{display:flex;flex-wrap:wrap;gap:8px}
.k-opt{font:inherit;font-size:.95rem;min-height:48px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;touch-action:manipulation}
.k-opt[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.k-opt .dots i{width:10px;height:5px}

.k-opt[aria-pressed="true"] .dots i.on{background:var(--band)}
.k-stack{display:flex;flex-direction:column;gap:8px}
.k-stack .k-opt{justify-content:space-between;width:100%}
.k-brands{display:flex;flex-direction:column;gap:2px}
.k-brands button{font:inherit;font-size:.95rem;text-align:left;min-height:44px;padding:8px 12px;border:0;border-radius:8px;background:transparent;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between}
.k-brands button small{color:var(--muted);font-family:var(--mono)}
.k-brands button[aria-pressed="true"]{background:var(--chip);font-weight:700}
.k-main{min-width:0;padding-inline:24px;padding-block:0 60px}
.k-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.k-top input{flex:1 1 260px;min-width:0;font:inherit;font-size:1.05rem;min-height:52px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.k-reset{font:inherit;min-height:52px;padding:10px 18px;border-radius:12px;border:1px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer;font-weight:700}
.k-count{color:var(--muted);font-variant-numeric:tabular-nums}
.k-hint{color:var(--muted);margin:14px 0 4px;font-size:.95rem}
.k-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:14px}
.k-card{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:0;cursor:pointer;display:flex;flex-direction:column;touch-action:manipulation;min-width:0}
.k-card:active{transform:scale(.985)}
.k-card .pic{aspect-ratio:4/3}
.k-card .kb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.k-card .kmarke{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.k-card h3{font-family:var(--display);font-weight:500;font-size:1.3rem;line-height:1.2;margin:0;text-wrap:balance}
.k-card .kfoot{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.k-card .price{font-size:1.35rem}
.k-card .kmore{color:var(--accent);font-size:.9rem;font-weight:700}
.k-sheet{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.k-panel{background:var(--surface);color:var(--ink);border-radius:18px;width:min(1120px,100%);max-height:100%;overflow-y:auto;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);position:relative}
.k-panel .kl{padding:28px;display:flex;flex-direction:column;gap:16px;border-right:1px solid var(--line);min-width:0}
.k-panel .kr{padding:28px 32px 32px;min-width:0}
.k-panel .pic{aspect-ratio:4/3;border-radius:12px}
.k-panel h2{font-family:var(--display);font-weight:500;font-size:2.1rem;line-height:1.1;margin:0 0 6px;text-wrap:balance;padding-right:120px}
.k-panel .story{font-size:1.02rem;line-height:1.6;max-width:62ch}
.k-panel .price{font-size:1.8rem}
.k-panel .arw{font-size:.95rem;gap:6px 12px}
.k-panel .arw .bar5{height:9px}
.k-panel dl.facts{font-size:.95rem;gap:6px 14px}
.k-close{position:absolute;top:16px;right:16px;font:inherit;font-weight:700;min-height:52px;padding:10px 18px;border-radius:12px;border:0;background:var(--ink);color:var(--surface);cursor:pointer;z-index:2}
.k-exit{font:inherit;font-size:.8rem;color:var(--muted);background:none;border:0;text-align:left;padding:8px 0;cursor:pointer;margin-top:auto}
.k-empty{padding:60px 0;color:var(--muted);font-size:1.1rem}
.k-link{font-size:.85rem;color:var(--accent)}
@media (max-width:860px){.k-app{grid-template-columns:1fr}.k-side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.k-panel{grid-template-columns:1fr}.k-panel .kl{border-right:0;border-bottom:1px solid var(--line)}.k-main{padding-inline:16px}}

footer{margin-top:48px;color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);padding-top:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:520px){.meta{text-align:left}.count{margin-left:0;width:100%}}
</style>

 brachte mit dem Blender Hendrik Kelner eigene Zigarren heraus. Seit 1995 gehört AVO zum Haus Davidoff, die Musik prägt die Marke bis heute.\nDie Robusto ist kurz und kräftig gebaut. Sie gilt als das beliebteste Format überhaupt, weil sie in rund 45 Minuten den vollen Charakter einer Mischung zeigt.\nGenusstipp: Dazu passen ein kräftiger Rum, ein Bourbon oder ein Portwein. Eher für den Abend und nach dem Essen.","rd":"ca. 40 bis 60 Minuten","ar":[2,5,1,1,1,4,1,1,1,1,4,2]},{"nr":"TOB-101201","name":"AVO XO Notturno","marke":"AVO","format":"","deckblatt":"maduro","einheit":"Packung","preis":48.0,"tubo":false,"ltd":false,"h":"Dominikanische Republik","s":3,"a":"Holz, Nüsse, cremig","g":"AVO XO ist die musikalische Linie der Marke: Die Formate tragen Namen aus der Musik. Notturno heißt Nachtstück, eine kurze Zigarre für den Abend.\nAvo Uvezian wurde 1926 in Beirut geboren, war Jazzpianist und Komponist und spielte in Hotels auf der ganzen Welt. 1987 erfüllte er sich einen Traum und brachte mit dem Blender Hendrik Kelner eigene Zigarren heraus. Seit 1995 gehört AVO zum Haus Davidoff, die Musik prägt die Marke bis heute.\nGenusstipp: Dazu passen ein Espresso, ein gereifter Rum oder ein milder Speyside-Whisky. Ideal am frühen Abend.","rd":"ca. 40 bis 60 Minuten","ar":[5,1,1,1,4,2,4,3,3,1,1,1]},{"nr":"TOB-101306","name":"Zino Nicaragua Half Corona","marke":"Zino","format":"Half Corona","deckblatt":"colorado","einheit":"Stück","preis":5.9,"tubo":false,"ltd":false,"h":"Nicaragua","e":"Nicaragua","s":3,"a":"Pfeffer, Holz, cremig","g":"Die Half Corona der Zino Nicaragua ist kurz und würzig. Ideal für eine Pause von 20 bis 30 Minuten.\nZino ist nach Zino Davidoff benannt und die zweite Marke im Haus Davidoff. Sie ist moderner und unkomplizierter als die klassischen Davidoff-Linien, aber mit dem gleichen Anspruch an die Verarbeitung.\nDie Half Corona ist ein sehr kurzes Format für eine Pause von 20 bis 30 Minuten, ohne auf eine echte Zigarre zu verzichten.\nGenusstipp: Dazu passen ein Espresso, ein gereifter Rum oder ein milder Speyside-Whisky. Ideal am frühen Abend.","rd":"ca. 20 bis 35 Minuten","ar":[4,5,1,1,4,1,1,1,1,1,2,1]},{"nr":"TOB-101366","name":"VegaFina Year of the Horse Higüeyanos","marke":"VegaFina","format":"","deckblatt":"colorado","einheit":"Packung","preis":238.4,"tubo":false,"ltd":true,"h":"Dominikanische Republik","e":"Dominikanische Republik, Nicaragua, Ecuador","m":"152 × 56","s":3,"a":"cremig, Holz, Kaffee, Kakao, Melasse","g":"Zum chinesischen Jahr des Pferdes 2026 hat VegaFina eine limitierte Edition aufgelegt. Sie ehrt den Caballo de Paso Higüeyano, eine Pferderasse aus der Dominikanischen Republik. Weltweit gibt es nur 4.300 nummerierte Kisten zu 16 Stück.\nVegaFina wurde Ende der 1990er Jahre in der Dominikanischen Republik eingeführt und entsteht bei der Tabacalera de García in La Romana. Die Marke steht für milde, zugängliche Zigarren und ist besonders in Europa beliebt.\nGenusstipp: Dazu passen ein Espresso, ein gereifter Rum oder ein milder Speyside-Whisky. Ideal am frühen Abend.","rd":"ca. 60 bis 90 Minuten","ar":[4,1,1,1,5,3,1,3,4,1,2,1]}]</script>
<script id="app">
(function(){
const DATA=JSON.parse(document.getElementById('data').textContent);
let PHOTOS={};try{PHOTOS=JSON.parse(document.getElementById('photos').textContent)||{}}catch(e){}
const root=document.getElementById('root');
const AR=['Holz','Pfeffer','Kräuter','Frucht','Creme','Süße','Nuss','Schokolade','Kaffee','Röstaromen','Leder','Erde'];
const PB=[['0-10','bis € 10'],['10-20','€ 10–20'],['20-30','€ 20–30'],['30-40','€ 30–40'],['40-50','€ 40–50'],['50-9999','über € 50']];
const inPB=(p,k)=>{const [a,b]=k.split('-').map(Number);return p>=a&&p<b};
const st={preis:'',kiosk:location.hash==='#theke',open:null,ar:[],q:'',marke:'',einheit:'',staerke:'',sort:'marke',edit:false,sel:null};
const SL=['','mild','mild bis mittel','mittel','mittel bis kräftig','kräftig'];
function meter(s){return `<div class="str" aria-label="Stärke ${s} von 5: ${SL[s]}"><span class="dots">${[1,2,3,4,5].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</span><span>Stärke <b>${SL[s]}</b></span></div>`}
let assets=null,art=null,pending=null,timer=null;
const eur=n=>'€ '+n.toLocaleString('de-AT',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIM={'Robusto':[124,50],'Toro':[152,52],'Corona':[142,42],'Petit Corona':[129,42],'Half Corona':[90,44],'Short Corona':[100,42],'Short Robusto':[102,50],'Petit Robusto':[102,50],'Double Robusto':[140,54],'Gordo':[152,60],'Chubby':[125,58],'Gran Robusto':[140,56],'Gran Toro':[155,56],'Belicoso':[140,52],'Lonsdale':[165,42],'Magnum':[152,54],'Salomón':[184,57],'Petit Panetela':[115,36],'Krumme':[145,36],'Hermoso':[152,48],'Perla':[102,40],'Petit Yema':[115,48],'Valentino':[150,52],'Titán':[160,56],'Bala':[150,54],'Divinos':[110,50],'Brillantes':[127,46]};
const WR={claro:['#c9a074','#a87d52'],colorado:['#8a5a33','#6c4424'],maduro:['#4a2f1f','#33200f']};
function cigar(c){
  const [L,R]=DIM[c.format]||[140,48];
  const W=300,H=110,len=L/190*270,th=Math.max(10,R/64*44);
  const x0=(W-len)/2,y0=H/2-th/2,[c1,c2]=WR[c.deckblatt]||WR.colorado;
  const taper=c.format==='Belicoso'||c.format==='Salomón';
  const xe=x0+len,r=th/2;
  const head=taper?`L${xe-th*1.4},${y0} Q${xe},${y0+r*.6} ${xe},${y0+r} Q${xe},${y0+th-r*.6} ${xe-th*1.4},${y0+th}`:`L${xe-r},${y0} A${r},${r} 0 0 1 ${xe-r},${y0+th}`;
  const foot=c.format==='Salomón'?`M${x0+th*.9},${y0} ${head} L${x0+th*.9},${y0+th} Q${x0},${y0+th*.7} ${x0},${y0+r} Q${x0},${y0+th*.3} ${x0+th*.9},${y0}Z`:`M${x0},${y0} ${head} L${x0},${y0+th}Z`;
  const bx=x0+len*.68,bw=Math.max(18,len*.11);
  const ini=c.marke.replace(/[^A-Za-zÀ-ÿ ]/g,'').split(' ').filter(Boolean).map(w=>w[0]).join('').slice(0,3).toUpperCase();
  const gid='g'+c.nr.replace(/\W/g,'');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Zeichnung ${esc(c.format||'Zigarre')}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset=".55" stop-color="${c2}"/><stop offset="1" stop-color="${c1}"/></linearGradient></defs>
  <ellipse cx="${W/2}" cy="${y0+th+9}" rx="${len/2}" ry="3" fill="#000" opacity=".12"/>
  <path d="${foot}" fill="url(#${gid})"/>
  ${c.format==='Salomón'?'':`<rect x="${x0}" y="${y0}" width="3" height="${th}" fill="#d9c7a8" opacity=".85"/>`}
  <path d="M${x0+8},${y0+th*.3} C${x0+len*.3},${y0+th*.22} ${x0+len*.5},${y0+th*.4} ${x0+len*.85},${y0+th*.32}" stroke="#000" stroke-opacity=".14" fill="none"/>
  <path d="M${x0+12},${y0+th*.72} C${x0+len*.35},${y0+th*.8} ${x0+len*.6},${y0+th*.62} ${x0+len*.8},${y0+th*.7}" stroke="#fff" stroke-opacity=".10" fill="none"/>
  ${c.tubo?'':`<rect x="${bx}" y="${y0-1}" width="${bw}" height="${th+2}" rx="1.5" fill="#b08a3e"/><rect x="${bx}" y="${y0+1.5}" width="${bw}" height="1.2" fill="#2a1d0c" opacity=".5"/><rect x="${bx}" y="${y0+th-2.7}" width="${bw}" height="1.2" fill="#2a1d0c" opacity=".5"/><text x="${bx+bw/2}" y="${y0+r+3}" text-anchor="middle" font-family="Georgia,serif" font-size="${Math.min(9,th*.45)}" font-weight="700" fill="#2a1d0c">${esc(ini)}</text>`}
  ${c.tubo?`<rect x="${x0-6}" y="${y0-5}" width="${len+12}" height="${th+10}" rx="${(th+10)/2}" fill="#9aa3a8" opacity=".35" stroke="#7c868b" stroke-opacity=".6"/>`:''}
  </svg>`;
}
function filtered(){
  const q=st.q.trim().toLowerCase();
  let a=DATA.filter(c=>(!st.marke||c.marke===st.marke)&&(!st.einheit||c.einheit===st.einheit)&&(!st.staerke||String(c.s)===st.staerke)&&(!st.preis||inPB(c.preis,st.preis))&&(!st.aroma||(c.ar&&c.ar[+st.aroma]>=4))&&(!st.ar.length||(c.ar&&st.ar.every(i=>c.ar[i]>=4)))&&(!q||(c.name+' '+c.marke+' '+c.format+' '+c.nr+' '+(c.h||'')+' '+(c.a||'')).toLowerCase().includes(q)));
  if(st.sort==='mild')a.sort((x,y)=>x.s-y.s||x.preis-y.preis);
  if(st.sort==='kraft')a.sort((x,y)=>y.s-x.s||x.preis-y.preis);
  if(st.sort==='auf')a.sort((x,y)=>x.preis-y.preis);
  else if(st.sort==='ab')a.sort((x,y)=>y.preis-x.preis);
  else if(st.sort==='marke')a.sort((x,y)=>x.marke.localeCompare(y.marke,'de')||x.name.localeCompare(y.name,'de'));
  return a;
}
function card(c){
  const p=PHOTOS[c.nr];
  const chips=[c.format,c.tubo?'Tubo':'',c.einheit==='Packung'?'Packung':'Einzelstück'].filter(Boolean).map(t=>`<span class="chip">${esc(t)}</span>`).join('')+(c.ltd?'<span class="chip ltd">Limitiert / Edition</span>':'');
  const tools=st.edit&&assets?`<div class="tools">
    <label>Foto hochladen<input type="file" accept="image/*" data-up="${c.nr}" id="up-${c.nr}"></label>
    <a href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(c.name+' cigar')}" target="_blank" rel="noopener">Foto suchen</a>
    ${p?`<button type="button" data-del="${c.nr}">Foto entfernen</button>`:''}</div>`:'';
  return `<article class="card"><div class="pic${st.sel===c.nr?' sel':''}" data-pic="${c.nr}" ${st.edit&&assets?'tabindex="0" title="Klicken, dann Bild mit Strg+V einfügen oder Datei hierher ziehen"':''}>${p?`<img src="${esc(p)}" alt="${esc(c.name)}" loading="lazy">`:cigar(c)}</div>
  <div class="body"><h3 class="name">${esc(c.name)}</h3><div class="chips">${chips}</div>${meter(c.s)}
  ${c.rd?`<p class="aroma">Rauchdauer ${esc(c.rd)}</p>`:''}${c.ar?`<div class="notes" aria-label="Hauptaromen">${c.ar.map((v,i)=>[v,i]).filter(x=>x[0]>=3).sort((a,b)=>b[0]-a[0]).slice(0,4).map(([v,i])=>`<span>${AR[i]}<em>${'•'.repeat(v)}</em></span>`).join('')}</div>`:''}${c.a?`<p class="aroma">${esc(c.a)}</p>`:''}
  <details class="more"><summary>Geschichte &amp; Daten</summary>${(c.g||'').split('\n').map(x=>`<p class="story">${esc(x)}</p>`).join('')}
  ${c.ar?`<div class="arw" role="list" aria-label="Aromaprofil">${c.ar.map((v,i)=>`<span role="listitem">${AR[i]}</span><div class="bar5"><i style="width:${v*20}%"></i></div><b>${v}/5</b>`).join('')}</div>`:''}<dl class="facts">${[['Herkunft',c.h],['Deckblatt',c.d],['Umblatt',c.u],['Einlage',c.e],['Format',c.m&&/×/.test(c.m)?`${c.format?c.format+', ':''}${c.m} (mm × Ringmaß)`:(c.m||c.format)],['Stärke',`${c.s} von 5 (${SL[c.s]})`],['Rauchdauer',c.rd]].filter(r=>r[1]).map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></details>${tools}
  <div class="foot"><span class="price">${eur(c.preis)} <small>/ ${c.einheit==='Packung'?'Pkg.':'Stk.'}</small></span><span class="nr">${esc(c.nr)}</span></div></div></article>`;
}
function render(){
  document.body.classList.toggle('kiosk',st.kiosk);
  if(st.kiosk){renderKiosk();return}
  const a=filtered(),brands=[...new Set(DATA.map(c=>c.marke))].sort((x,y)=>x.localeCompare(y,'de'));
  let list='';
  if(!a.length)list='<p class="empty">Keine Zigarre passt zu dieser Suche.</p>';
  else if(st.sort==='marke'){
    const g={};a.forEach(c=>(g[c.marke]=g[c.marke]||[]).push(c));
    list=Object.keys(g).map(b=>`<section class="brand" id="m-${b.replace(/[^A-Za-z0-9]/g,'')}"><h2>${esc(b)} <small>${g[b].length} ${g[b].length===1?'Sorte':'Sorten'}</small></h2><div class="grid">${g[b].map(card).join('')}</div></section>`).join('');
  } else list=`<section class="brand"><div class="grid">${a.map(card).join('')}</div></section>`;
  const nPhotos=Object.keys(PHOTOS).length;
  root.innerHTML=`<div class="wrap">
  <header class="top"><h1>Humidor-<em>Katalog</em></h1><div class="meta"><a class="k-link" href="#theke">Thekenansicht für das iPad öffnen</a><span><b>${DATA.length}</b> Zigarren · <b>${brands.length}</b> Marken</span><span>Preise in Euro inkl. MwSt. · Stand 13.10.2026</span></div></header>
  <div class="bar" role="search">
    <input id="q" type="search" placeholder="Suchen: Marke, Format, Name …" value="${esc(st.q)}" aria-label="Suchen">
    <select id="marke" aria-label="Marke"><option value="">Alle Marken</option>${brands.map(b=>`<option${b===st.marke?' selected':''}>${esc(b)}</option>`).join('')}</select>
    <div class="seg" role="group" aria-label="Einheit">${[['','Alle'],['Stück','Einzeln'],['Packung','Packungen']].map(([v,l])=>`<button type="button" data-ein="${v}" aria-pressed="${st.einheit===v}">${l}</button>`).join('')}</div>
    <select id="aroma" aria-label="Aroma"><option value="">Alle Aromen</option>${AR.map((n,i)=>`<option value="${i}"${st.aroma===String(i)?' selected':''}>${n}</option>`).join('')}</select>
    <select id="preis" aria-label="Preis"><option value="">Alle Preise</option>${PB.map(([v,l])=>`<option value="${v}"${st.preis===v?' selected':''}>${l} (${DATA.filter(c=>inPB(c.preis,v)).length})</option>`).join('')}</select>
    <select id="staerke" aria-label="Stärke"><option value="">Alle Stärken</option>${[1,2,3,4,5].map(i=>`<option value="${i}"${st.staerke===String(i)?' selected':''}>${SL[i]}</option>`).join('')}</select>
    <select id="sort" aria-label="Sortierung">${[['marke','Nach Marke'],['mild','Mild zuerst'],['kraft','Kräftig zuerst'],['auf','Preis aufsteigend'],['ab','Preis absteigend']].map(([v,l])=>`<option value="${v}"${st.sort===v?' selected':''}>${l}</option>`).join('')}</select>
    ${assets?`<button type="button" class="editbtn" id="edit" aria-pressed="${st.edit}">${st.edit?'Bearbeiten beenden':'Fotos bearbeiten'}</button>`:''}
    <span class="count">${a.length} von ${DATA.length}</span>
  </div>
  ${st.sort==='marke'&&!st.marke&&!st.q?`<nav class="index" aria-label="Marken">${brands.map(b=>`<a href="#m-${b.replace(/[^A-Za-z0-9]/g,'')}">${esc(b)}</a>`).join('')}</nav>`:''}
  ${st.edit?`<div class="hint"><b>Fotos ergänzen:</b> „Foto suchen“ öffnet die Bildersuche. Bild speichern und mit „Foto hochladen“ einfügen, oder: Bild im Browser kopieren, hier auf die Zeichnung klicken und <b>Strg+V</b> drücken. Dateien lassen sich auch direkt auf die Zeichnung ziehen. ${nPhotos} von ${DATA.length} Zigarren haben ein Foto.</div>`:''}
  ${list}
  <footer>Aromaprofil: eigene Einschätzung auf einer Skala von 0 bis 5 aus Hersteller- und Fachpresseangaben, Deckblatt und Stärke. Beim Aromafilter werden Zigarren gezeigt, bei denen das Aroma mit 4 oder 5 ausgeprägt ist. Rauchdauer als Richtwert, je nach Zugtempo. Stärke von 1 (mild) bis 5 (kräftig): Sie beschreibt, wie intensiv Nikotin und Körper der Zigarre wirken, und ist eine Einschätzung nach Hersteller- und Fachpresseangaben. Angaben zu Tabaken und Maßen ohne Gewähr. Zeichnungen zeigen das ungefähre Format, kein Produktfoto. Abgabe von Tabakwaren nur an Personen ab 18 Jahren.</footer></div>`;
}

function kOpt(attr,val,label,on,extra){return `<button type="button" class="k-opt" ${attr}="${esc(val)}" aria-pressed="${on}">${label}${extra||''}</button>`}
function topNotes(c){return c.ar?`<div class="notes">${c.ar.map((v,i)=>[v,i]).filter(x=>x[0]>=3).sort((a,b)=>b[0]-a[0]).slice(0,3).map(([v,i])=>`<span>${AR[i]}<em>${'•'.repeat(v)}</em></span>`).join('')}</div>`:''}
function kCard(c){const p=PHOTOS[c.nr];
  return `<button type="button" class="k-card" data-open="${c.nr}"><div class="pic">${p?`<img src="${esc(p)}" alt="" loading="lazy">`:cigar(c)}</div><div class="kb"><span class="kmarke">${esc(c.marke)}${c.format?' · '+esc(c.format):''}</span><h3>${esc(c.name)}</h3>${meter(c.s)}${topNotes(c)}<div class="kfoot"><span class="price">${eur(c.preis)} <small>/ ${c.einheit==='Packung'?'Pkg.':'Stk.'}</small></span><span class="kmore">Mehr ›</span></div></div></button>`}
function kSheet(c){const p=PHOTOS[c.nr];
  const facts=[['Marke',c.marke],['Herkunft',c.h],['Deckblatt',c.d],['Umblatt',c.u],['Einlage',c.e],['Format',c.m&&/×/.test(c.m)?`${c.format?c.format+', ':''}${c.m} (mm × Ringmaß)`:(c.m||c.format)],['Rauchdauer',c.rd],['Einheit',c.einheit==='Packung'?'Packung':'Einzelstück'+(c.tubo?' im Tubo':'')]].filter(r=>r[1]);
  return `<div class="k-sheet" data-close="1"><div class="k-panel" role="dialog" aria-modal="true" aria-label="${esc(c.name)}">
  <button type="button" class="k-close" data-close="1">Schließen ✕</button>
  <div class="kl"><div class="pic">${p?`<img src="${esc(p)}" alt="${esc(c.name)}">`:cigar(c)}</div>
   <span class="price">${eur(c.preis)} <small>/ ${c.einheit==='Packung'?'Packung':'Stück'}</small></span>
   ${meter(c.s)}${c.ltd?'<div class="chips"><span class="chip ltd">Limitiert / Edition</span></div>':''}
   <dl class="facts">${facts.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>
  <div class="kr"><h2>${esc(c.name)}</h2>${c.a?`<p class="aroma" style="font-size:1rem">${esc(c.a)}</p>`:''}
   ${(c.g||'').split('\n').map(x=>`<p class="story">${esc(x)}</p>`).join('')}
   ${c.ar?`<h3 style="font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 4px">Aromaprofil</h3><div class="arw">${c.ar.map((v,i)=>`<span>${AR[i]}</span><div class="bar5"><i style="width:${v*20}%"></i></div><b>${v}/5</b>`).join('')}</div>`:''}</div></div></div>`}
function renderKiosk(){
  const a=filtered();
  const bc={};DATA.forEach(c=>bc[c.marke]=(bc[c.marke]||0)+1);
  const brands=Object.keys(bc).sort((x,y)=>x.localeCompare(y,'de'));
  const busy=st.preis||st.q||st.marke||st.staerke||st.ar.length||st.einheit||st.sort!=='marke';
  root.innerHTML=`<div class="k-app"><aside class="k-side" aria-label="Filter">
   <h1 class="k-brand">Humidor-<em>Katalog</em></h1>
   <div><h3>Stärke</h3><div class="k-stack">${[1,2,3,4,5].map(i=>kOpt('data-ks',String(i),SL[i][0].toUpperCase()+SL[i].slice(1),st.staerke===String(i),`<span class="dots">${[1,2,3,4,5].map(j=>`<i class="${j<=i?'on':''}"></i>`).join('')}</span>`)).join('')}</div></div>
   <div><h3>Preis</h3><div class="k-opts">${PB.map(([v,l])=>kOpt('data-kp',v,l,st.preis===v)).join('')}</div></div>
   <div><h3>Aromen</h3><div class="k-opts">${AR.map((n,i)=>kOpt('data-ka',String(i),n,st.ar.includes(i))).join('')}</div></div>
   <div><h3>Sortieren</h3><div class="k-opts">${[['marke','Marke'],['mild','Mild zuerst'],['kraft','Kräftig zuerst'],['auf','Preis ↑'],['ab','Preis ↓']].map(([v,l])=>kOpt('data-ko',v,l,st.sort===v)).join('')}</div></div>
   <div><h3>Angebot</h3><div class="k-opts">${[['','Alle'],['Stück','Einzeln'],['Packung','Packungen']].map(([v,l])=>kOpt('data-ke',v,l,st.einheit===v)).join('')}</div></div>
   <div><h3>Marken</h3><div class="k-brands">${brands.map(b=>`<button type="button" data-kb="${esc(b)}" aria-pressed="${st.marke===b}"><span>${esc(b)}</span><small>${bc[b]}</small></button>`).join('')}</div></div>
   <button type="button" class="k-exit" data-kexit="1">Zur Standardansicht</button>
  </aside>
  <main class="k-main"><div class="k-top" role="search"><input id="kq" type="search" placeholder="Zigarre, Marke oder Aroma suchen …" value="${esc(st.q)}" aria-label="Suchen" autocomplete="off">
   ${busy?'<button type="button" class="k-reset" data-kreset="1">Alle anzeigen</button>':''}<span class="k-count">${a.length} ${a.length===1?'Zigarre':'Zigarren'}</span></div>
   <p class="k-hint">Tippen Sie auf eine Zigarre für Geschichte, Tabake und Aromaprofil. Abgabe nur an Personen ab 18 Jahren.</p>
   ${a.length?`<div class="k-grid">${a.map(kCard).join('')}</div>`:'<p class="k-empty">Keine Zigarre passt zu dieser Auswahl. Tippen Sie auf „Alle anzeigen“.</p>'}
  </main></div>${st.open?kSheet(DATA.find(c=>c.nr===st.open)):''}`;
}
function kReset(){st.preis='';st.q='';st.marke='';st.staerke='';st.ar=[];st.einheit='';st.sort='marke';st.open=null}
let idle=null;function poke(){clearTimeout(idle);if(st.kiosk)idle=setTimeout(()=>{kReset();render();window.scrollTo(0,0)},150000)}
['pointerdown','keydown','scroll'].forEach(ev=>window.addEventListener(ev,poke,{passive:true}));
window.addEventListener('hashchange',()=>{st.kiosk=location.hash==='#theke';st.open=null;render();window.scrollTo(0,0)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&st.open){st.open=null;render()}});
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function doc(){
  const reset=(document.head.querySelector('style')||{}).textContent||'';
  const keep=id=>{const e=document.getElementById(id);return e?e.outerHTML:''};
  const link=document.querySelector('link[href*="fonts.googleapis"]');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
   +keep('t')+(link?link.outerHTML:'')+keep('s')+'<div id="root"></div>'
   +'<script type="application/json" id="photos">'+JSON.stringify(PHOTOS).replace(/</g,'\\u003c')+'<\/script>'
   +keep('data')+keep('app')+'</body></html>';
}
function save(){clearTimeout(timer);timer=setTimeout(async()=>{
  if(!art){toast('Speichern ist in dieser Ansicht nicht möglich.');return}
  try{await art.publish(doc());toast('Gespeichert')}catch(e){
    if(e&&e.code==='conflict')return;
    toast('Nicht gespeichert: '+((e&&e.message)||'Fehler'));}
},1200)}
async function upload(nr,file){
  if(!assets||!file||!file.type.startsWith('image/')){toast('Bitte eine Bilddatei wählen.');return}
  const pic=root.querySelector(`[data-pic="${nr}"]`);
  if(pic){const b=document.createElement('div');b.className='busy';b.textContent='Lädt hoch …';pic.appendChild(b)}
  try{const r=await assets.upload(file);PHOTOS[nr]=r.url;render();save();}
  catch(e){toast('Hochladen fehlgeschlagen: '+((e&&e.message)||'Fehler'));render()}
}
root.addEventListener('input',e=>{if(e.target.id==='kq'){st.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById('kq');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){};return}
  if(e.target.id==='q'){st.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById('q');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}});
root.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='marke'){st.marke=t.value;render()}
  else if(t.id==='staerke'){st.staerke=t.value;render()}
  else if(t.id==='aroma'){st.aroma=t.value;render()}
  else if(t.id==='preis'){st.preis=t.value;render()}
  else if(t.id==='sort'){st.sort=t.value;render()}
  else if(t.dataset.up&&t.files[0])upload(t.dataset.up,t.files[0]);
});
root.addEventListener('click',e=>{
  if(st.kiosk){
    const g=s=>e.target.closest(s);let x;
    if((x=g('[data-open]'))){st.open=x.dataset.open;render();const pnl=root.querySelector('.k-panel');if(pnl){pnl.scrollTop=0;root.querySelector('.k-close').focus()}return}
    if(g('.k-close')||(e.target.classList&&e.target.classList.contains('k-sheet'))){const k=st.open;st.open=null;render();const b=root.querySelector(`[data-open="${k}"]`);if(b)b.focus({preventScroll:true});return}
    if(g('.k-panel'))return;
    if((x=g('[data-ks]'))){st.staerke=st.staerke===x.dataset.ks?'':x.dataset.ks}
    else if((x=g('[data-ka]'))){const i=+x.dataset.ka;st.ar=st.ar.includes(i)?st.ar.filter(j=>j!==i):[...st.ar,i]}
    else if((x=g('[data-kp]'))){st.preis=st.preis===x.dataset.kp?'':x.dataset.kp}
    else if((x=g('[data-ko]'))){st.sort=x.dataset.ko}
    else if((x=g('[data-ke]'))){st.einheit=x.dataset.ke}
    else if((x=g('[data-kb]'))){st.marke=st.marke===x.dataset.kb?'':x.dataset.kb}
    else if(g('[data-kreset]')){kReset()}
    else if(g('[data-kexit]')){location.hash='';return}
    else return;
    render();window.scrollTo({top:0});return;
  }
  const ein=e.target.closest('[data-ein]');if(ein){st.einheit=ein.dataset.ein;render();return}
  if(e.target.id==='edit'){st.edit=!st.edit;st.sel=null;render();return}
  const del=e.target.closest('[data-del]');if(del){delete PHOTOS[del.dataset.del];render();save();return}
  const pic=e.target.closest('[data-pic]');
  if(pic&&st.edit&&assets){root.querySelectorAll('.pic.sel').forEach(p=>p.classList.remove('sel'));st.sel=pic.dataset.pic;pic.classList.add('sel');toast('Ausgewählt – jetzt Strg+V zum Einfügen')}
});
root.addEventListener('dragover',e=>{const p=e.target.closest('[data-pic]');if(p&&st.edit&&assets){e.preventDefault();p.classList.add('drag')}});
root.addEventListener('dragleave',e=>{const p=e.target.closest('[data-pic]');if(p)p.classList.remove('drag')});
root.addEventListener('drop',e=>{const p=e.target.closest('[data-pic]');if(p&&st.edit&&assets){e.preventDefault();p.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)upload(p.dataset.pic,f)}});
document.addEventListener('paste',e=>{
  if(!st.edit||!assets||!st.sel)return;
  const it=[...(e.clipboardData||{}).items||[]].find(i=>i.type.startsWith('image/'));
  if(it){e.preventDefault();upload(st.sel,it.getAsFile())}else toast('In der Zwischenablage ist kein Bild.');
});
render();poke();
if(window.claude&&window.claude.use){
  window.claude.use('assets').then(a=>{assets=a;if(a)render()}).catch(()=>{});
  window.claude.use('artifact').then(a=>{art=a}).catch(()=>{});
}
})();
</script>

<script>if("serviceWorker"in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{}))}</script>
</body></html>
